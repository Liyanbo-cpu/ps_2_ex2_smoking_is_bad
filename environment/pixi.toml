[workspace]
name = "smoke-bootstrap"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pandas = ">=2.2,<3"
matplotlib = ">=3.9,<4"
seaborn = ">=0.13,<0.14"
jupyterlab = ">=4,<5"
ipykernel = ">=6,<8"
nbformat = ">=5,<6"
pre-commit = ">=4,<5"
nbstripout = ">=0.7,<1"
altair = ">=5,<6"
vl-convert-python = ">=1,<2"

[environments]
smoke = []

[tasks]
jupyter = { cmd = "jupyter lab", cwd = ".." }
